<button [class]="classes()" type="button">
  @if (loading()) {
    <span aria-hidden="true" class="sui-button--spinner"></span>
  } @else {
    @if (showIconStart()) {
      <sui-icon [name]="icon()" [size]="iconSize()" />
    }
    <span>{{ name() }}</span>
    @if (showIconEnd()) {
      <sui-icon [name]="icon()" [size]="iconSize()" />
    }
  }
</button>
