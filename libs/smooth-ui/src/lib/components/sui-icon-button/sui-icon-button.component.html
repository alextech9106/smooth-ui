<span [ngClass]="{ 'badge-anchor': badge() }">
  <button
    (click)="trigger.emit()"
    [aria-label]="accessibleName()"
    [aria-pressed]="pressed() ?? null"
    [class]="classes()"
    [disabled]="disabled()"
    type="button"
  >
    <sui-icon [name]="icon()" [size]="computedIconSize()" />
  </button>

  @if (badge()) {
    <span class="badge">{{ badge() }}</span>
  }
</span>
