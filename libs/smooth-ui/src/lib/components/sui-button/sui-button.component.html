<button
  (click)="trigger.emit()"
  [aria-busy]="loading() || null"
  [aria-expanded]="expanded() ?? null"
  [aria-haspopup]="expanded() === undefined ? null : 'menu'"
  [aria-label]="label() !== '' || loading() || name() === '' ? accessibleName() : null"
  [class]="classes()"
  [class.sui-spacing-8]="name() === ''"
  [disabled]="disabled() || loading()"
  [type]="type()"
>
  @if (loading()) {
    <span aria-hidden="true" class="sui-button-spinner"></span>
  } @else {
    @if (showIconStart()) {
      <sui-icon [name]="icon()" [size]="computedIconSize()" />
    }
    @if (name() !== '') {
      <span>{{ name() }}</span>
    }
    @if (showIconEnd()) {
      <sui-icon [name]="icon()" [size]="computedIconSize()" />
    }
  }
</button>
