<div class="sui-button-split">
  @if (mode() === 'default') {
    <sui-button-group [buttons]="buttonSplit()" [shape]="shape()" [size]="size()" [variant]="variant()" />
  } @else {
    <sui-button-group [buttons]="iconSplit()" [shape]="shape()" [size]="size()" [variant]="variant()" />
  }

  @if (menuOpen() && menuItems().length) {
    <div #menu (keydown)="onMenuKeydown($event)" [aria-label]="name() || 'Options'"
         [class.split-menu-top]="placement() === 'top'" class="split-menu" role="menu" tabindex="-1">
      @for (menuItem of menuItems(); track menuItem.id) {
        <button (click)="selectItem(menuItem)" class="split-menu-item" role="menuitem" type="button">
          <sui-icon [name]="menuItem.icon.name" [size]="menuItem.icon.size" />
          <span>{{ menuItem.title }}</span>
        </button>

        @if (menuItem.separatorAfter) {
          <div class="split-separator" role="separator"></div>
        }
      }
    </div>
  }
</div>
