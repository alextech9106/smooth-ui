<div class="sui-input">
  <label [for]="inputId()" class="sui-label">{{ label() }} {{ required() ? '*' : optionalText() }}</label>

  <div [class]="classes()" class="sui-textarea">
    <textarea (blur)="touch.emit()" (input)="value.set($any($event.target).value)" (invalid)="$event.preventDefault()"
              [disabled]="disabled()" [id]="inputId()" [placeholder]="placeholder()" [readonly]="readonly()"
              [required]="required()" [value]="value()"></textarea>
  </div>

  @if (hint() && !showError()) {
    <span class="sui-hint">{{ hint() }}</span>
  }

  @if (showError()) {
    @for (error of errors(); track error.message) {
      <sui-error [error]="showCustomError() ? getCustomMessage(error.kind) : error.message" [inputId]="inputId()" />
    }
  }
</div>
